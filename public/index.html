<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PintORTillo</title>
  <meta name="description" content="PintORTillo: dibujá y adiviná con amigos en tiempo real.">
  <meta name="theme-color" content="#ff5d8f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff5d8f'/%3E%3Cpath d='M16 46 L40 18 L48 26 L22 52 L14 54 Z' fill='%23ffd23f' stroke='%231b1b2f' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.min.js" defer></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body data-screen="home">
  <a class="skip-link" href="#view">Saltar al contenido</a>
  <div class="topbar">
    <a class="brand" href="/" aria-label="PintORTillo, inicio">🎨 <span>PintORTillo</span></a>
    <span id="conn" class="conn" role="status" aria-live="polite"></span>
    <div class="topbar-actions">
      <button id="sound-toggle" class="icon-btn" type="button" aria-label="Silenciar sonido" aria-pressed="false">🔊</button>
      <input id="volume" class="volume" type="range" min="0" max="100" aria-label="Volumen">
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Modo claro u oscuro">🌙</button>
    </div>
  </div>
  <main id="view" tabindex="-1"></main>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>
  <noscript><p>PintORTillo necesita JavaScript.</p></noscript>
</body>
</html>
